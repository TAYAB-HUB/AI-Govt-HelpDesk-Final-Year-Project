services:
  - type: web
    name: ai-govt-helpdesk-backend
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        # Paste the Supabase PostgreSQL connection string during Blueprint setup.
        # SQLite cannot persist on a free Render web service.
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        # Set this to your Vercel production URL, for example:
        # https://your-project.vercel.app
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: PYTHON_VERSION
        value: 3.11.0
